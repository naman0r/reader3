<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Library</title>
    <style>
        /* Theme */
        :root {
            color-scheme: light;
            --bg: #f4f4f9;
            --text: #333;
            --muted: #666;
            --card-bg: #fff;
            --card-title: #2c3e50;
            --border: #ddd;
            --shadow: rgba(0,0,0,0.1);
            --btn-bg: #3498db;
            --btn-hover: #2980b9;
        }
        :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #16181d;
            --text: #e9ecef;
            --muted: #9aa0a6;
            --card-bg: #22252b;
            --card-title: #eef1f4;
            --border: #2a2e35;
            --shadow: rgba(0,0,0,0.4);
            --btn-bg: #2c81ba;
            --btn-hover: #4aa3e0;
        }

        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); margin: 0; padding: 40px; }
        .container { max-width: 800px; margin: 0 auto; }
        .header-row { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid var(--border); padding-bottom: 10px; }
        h1 { color: var(--text); margin: 0; }
        .theme-btn { padding: 8px 15px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 4px; color: var(--muted); font-family: inherit; font-size: 0.85em; cursor: pointer; }
        .theme-btn:hover { color: var(--btn-hover); border-color: var(--btn-hover); }
        .book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 30px; }
        .book-card { background: var(--card-bg); padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px var(--shadow); transition: transform 0.2s; }
        .book-title { font-size: 1.2em; font-weight: bold; color: var(--card-title); margin-bottom: 10px; }
        .book-meta { color: var(--muted); font-size: 0.9em; margin-bottom: 15px; }
        .btn { display: inline-block; background: var(--btn-bg); color: white; text-decoration: none; padding: 8px 15px; border-radius: 4px; font-size: 0.9em; }
        .btn:hover { background: var(--btn-hover); }
    </style>
    <script>
        // Applied before paint to avoid a flash of the light theme
        document.documentElement.dataset.theme =
            localStorage.getItem("theme") ||
            (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    </script>
</head>
<body>
    <div class="container">
        <div class="header-row">
            <h1>Library</h1>
            <button id="theme-toggle" class="theme-btn">Dark mode</button>
        </div>

        {% if not books %}
            <p>No processed books found. Run <code>reader3.py</code> on an epub first.</p>
        {% endif %}

        <div class="book-grid">
            {% for book in books %}
            <div class="book-card">
                <div class="book-title">{{ book.title }}</div>
                <div class="book-meta">
                    {{ book.author }}<br>
                    {{ book.chapters }} sections
                </div>
                <a href="/read/{{ book.id }}/0" class="btn">Read Book</a>
            </div>
            {% endfor %}
        </div>
    </div>

    <script>
        // Theme toggle, persisted across pages via localStorage
        const themeBtn = document.getElementById("theme-toggle");
        const syncThemeLabel = () =>
            themeBtn.textContent = document.documentElement.dataset.theme === "dark" ? "Light mode" : "Dark mode";
        themeBtn.onclick = () => {
            const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
            document.documentElement.dataset.theme = next;
            localStorage.setItem("theme", next);
            syncThemeLabel();
        };
        syncThemeLabel();
    </script>
</body>
</html>
